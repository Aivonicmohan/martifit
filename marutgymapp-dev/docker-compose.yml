services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marutfit-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "postgresql://marutfit:${DB_PASSWORD_URL}@10.0.2.12:5432/marutfit"
      JWT_SECRET: "${JWT_SECRET}"
    expose:
      - "5000"
    networks:
      - marutfit
      - floci_vpc

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marutfit-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - marutfit

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: marutfit-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    networks:
      - marutfit

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: marutfit-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - marutfit

networks:
  marutfit:
    driver: bridge

  floci_vpc:
    external: true
    name: floci-vpc-4566-ap-south-2-vpc-e9f3d420