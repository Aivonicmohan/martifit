
services:
  backend:
    image: "${BACKEND_IMAGE:?Set BACKEND_IMAGE to a GitLab Container Registry image URI}"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in the runtime environment}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the runtime environment}"
    expose:
      - "5000"
    networks:
      - marutfit

  frontend:
    image: "${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a GitLab Container Registry image URI}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"
    networks:
      - marutfit

  nginx:
    image: "${NGINX_IMAGE:?Set NGINX_IMAGE to a GitLab Container Registry image URI}"
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      - frontend
      - backend
    networks:
      - marutfit

networks:
  marutfit:
    external: true
    name: marutfit
