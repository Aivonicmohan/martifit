stages:
  - security
  - build
  - image_scan
  - deploy
  - verify

variables:
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  NGINX_IMAGE: "$CI_REGISTRY_IMAGE/nginx"

  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

# ==========================================================
# 1. SECRET DETECTION
# ==========================================================

secret_detection:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'
  script:
    - gitleaks detect
        --source .
        --no-banner
        --redact

# ==========================================================
# 2. DEPENDENCY SECURITY SCAN
# ==========================================================

dependency_scan:
  stage: security
  image: node:20-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'
  script:
    - cd backend
    - npm ci --ignore-scripts
    - npm audit --audit-level=high

    - cd ../frontend
    - npm ci --ignore-scripts
    - npm audit --audit-level=high

# ==========================================================
# 3. SOURCE / FILESYSTEM SECURITY SCAN
# ==========================================================

filesystem_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'
  script:
    - trivy fs
        --scanners vuln,secret,misconfig
        --severity HIGH,CRITICAL
        --exit-code 1
        .

# ==========================================================
# 4. BUILD DOCKER IMAGES
# ==========================================================

build_images:
  stage: build
  image: docker:27.5.1
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=true"]

  needs:
    - secret_detection
    - dependency_scan
    - filesystem_scan

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" |
      docker login "$CI_REGISTRY"
      -u "$CI_REGISTRY_USER"
      --password-stdin

  script:
    - docker build
        --platform linux/amd64
        -t "$BACKEND_IMAGE:$CI_COMMIT_SHA"
        ./backend

    - docker build
        --platform linux/amd64
        --build-arg NEXT_PUBLIC_API_URL=/api
        -t "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
        ./frontend

    - docker build
        --platform linux/amd64
        -t "$NGINX_IMAGE:$CI_COMMIT_SHA"
        ./nginx

    - docker save
        "$BACKEND_IMAGE:$CI_COMMIT_SHA"
        "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
        "$NGINX_IMAGE:$CI_COMMIT_SHA"
        -o marutfit-images.tar

  artifacts:
    expire_in: 1 day
    paths:
      - marutfit-images.tar

# ==========================================================
# 5. DOCKER IMAGE SECURITY SCAN
# ==========================================================

container_scan:
  stage: image_scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  needs:
    - build_images

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  before_script:
    - apk add --no-cache docker-cli
    - docker load -i marutfit-images.tar

  script:
    - trivy image
        --severity HIGH,CRITICAL
        --exit-code 1
        "$BACKEND_IMAGE:$CI_COMMIT_SHA"

    - trivy image
        --severity HIGH,CRITICAL
        --exit-code 1
        "$FRONTEND_IMAGE:$CI_COMMIT_SHA"

    - trivy image
        --severity HIGH,CRITICAL
        --exit-code 1
        "$NGINX_IMAGE:$CI_COMMIT_SHA"

# ==========================================================
# 6. PUSH IMAGES TO GITLAB CONTAINER REGISTRY
# ==========================================================

push_images:
  stage: image_scan
  image: docker:27.5.1

  services:
    - name: docker:27.5.1-dind
      command: ["--tls=true"]

  needs:
    - build_images
    - container_scan

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" |
      docker login "$CI_REGISTRY"
      -u "$CI_REGISTRY_USER"
      --password-stdin

    - docker load -i marutfit-images.tar

  script:
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$NGINX_IMAGE:$CI_COMMIT_SHA"

# ==========================================================
# 7. DEPLOY TO AWS EC2 USING OIDC + SSM
# ==========================================================

deploy_production:
  stage: deploy
  image: amazon/aws-cli:2.31.0

  needs:
    - push_images

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com

  before_script:
    - echo "$AWS_OIDC_TOKEN" > /tmp/aws-web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws-web-identity-token
    - export AWS_ROLE_ARN="$AWS_DEPLOY_ROLE_ARN"
    - export AWS_DEFAULT_REGION="ap-south-2"

    - aws sts get-caller-identity

  script:
    - |
      COMMAND_ID=$(aws ssm send-command \
        --region ap-south-2 \
        --instance-ids "$AWS_EC2_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --parameters commands="
          set -e

          cd /opt/marutfit

          export BACKEND_IMAGE='$BACKEND_IMAGE:$CI_COMMIT_SHA'
          export FRONTEND_IMAGE='$FRONTEND_IMAGE:$CI_COMMIT_SHA'
          export NGINX_IMAGE='$NGINX_IMAGE:$CI_COMMIT_SHA'

          docker compose \
            -f docker-compose.aws.yml \
            pull

          docker compose \
            -f docker-compose.aws.yml \
            up -d \
            --remove-orphans

          docker image prune -af --filter 'until=168h'
        " \
        --query 'Command.CommandId' \
        --output text)

      echo "SSM Command ID: $COMMAND_ID"

      for i in $(seq 1 30); do
        STATUS=$(aws ssm get-command-invocation \
          --region ap-south-2 \
          --command-id "$COMMAND_ID" \
          --instance-id "$AWS_EC2_INSTANCE_ID" \
          --query 'Status' \
          --output text)

        echo "Deployment status: $STATUS"

        case "$STATUS" in
          Success)
            echo "Deployment completed successfully."
            exit 0
            ;;
          Failed|Cancelled|TimedOut)
            echo "Deployment failed."
            exit 1
            ;;
        esac

        sleep 10
      done

      echo "Deployment timed out."
      exit 1

# ==========================================================
# 8. POST-DEPLOYMENT HEALTH CHECK
# ==========================================================

health_check:
  stage: verify
  image: curlimages/curl:latest

  needs:
    - deploy_production

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  script:
    - echo "Checking MarutFit application..."
    - curl --fail --silent --show-error
        --max-time 20
        "http://$EC2_PUBLIC_IP/health"