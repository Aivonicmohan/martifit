
stages:
  - security
  - build
  - image_scan
  - deploy
  - verify

variables:
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"
  NGINX_IMAGE: "$CI_REGISTRY_IMAGE/nginx"

  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_DRIVER: "overlay2"

# ==========================================================
# 1. SECRET DETECTION
# ==========================================================


dependency_scan:
  stage: security
  image: node:20-bookworm

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  script:
    - cd marutgymapp-dev/backend
    - npm ci --ignore-scripts
    - npm audit --audit-level=high
    - cd ../frontend
    - npm ci --ignore-scripts
    - npm audit --audit-level=high


# ==========================================================
# 2. DEPENDENCY SECURITY SCAN
# ==========================================================

dependency_scan:
  stage: security
  image: node:20-bookworm

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  script:
    - cd backend
    - npm ci --ignore-scripts
    - npm audit --audit-level=high
    - cd ../frontend
    - npm ci --ignore-scripts
    - npm audit --audit-level=high

# ==========================================================
# 3. SOURCE / FILESYSTEM SECURITY SCAN
# ==========================================================

filesystem_scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  script:
    - >-
      trivy fs
      --scanners vuln,secret,misconfig
      --severity HIGH,CRITICAL
      --exit-code 1
      .

# ==========================================================
# 4. BUILD AND PUSH DOCKER IMAGES
# ==========================================================

build_images:
  stage: build
  image: docker:27.5.1

  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=true"]

  needs:
    - secret_detection
    - dependency_scan
    - filesystem_scan

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  before_script:
    - >-
      printf '%s' "$CI_REGISTRY_PASSWORD" |
      docker login "$CI_REGISTRY"
      -u "$CI_REGISTRY_USER"
      --password-stdin
    - docker info

  script:
    # Build backend
    - >-
      docker build
      --platform linux/amd64
      -t "$BACKEND_IMAGE:$CI_COMMIT_SHA"
      ./backend

    # Build frontend
    - >-
      docker build
      --platform linux/amd64
      --build-arg NEXT_PUBLIC_API_URL=/api
      -t "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
      ./frontend

    # Build Nginx
    - >-
      docker build
      --platform linux/amd64
      -t "$NGINX_IMAGE:$CI_COMMIT_SHA"
      ./nginx

    # Push immutable commit-tagged images
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
    - docker push "$NGINX_IMAGE:$CI_COMMIT_SHA"

# ==========================================================
# 5. SCAN IMAGES IN GITLAB CONTAINER REGISTRY
# ==========================================================

container_scan:
  stage: image_scan

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  needs:
    - job: build_images
      artifacts: false

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"

  script:
    - >-
      trivy image
      --image-src remote
      --scanners vuln
      --severity HIGH,CRITICAL
      --exit-code 1
      "$BACKEND_IMAGE:$CI_COMMIT_SHA"

    - >-
      trivy image
      --image-src remote
      --scanners vuln
      --severity HIGH,CRITICAL
      --exit-code 1
      "$FRONTEND_IMAGE:$CI_COMMIT_SHA"

    - >-
      trivy image
      --image-src remote
      --scanners vuln
      --severity HIGH,CRITICAL
      --exit-code 1
      "$NGINX_IMAGE:$CI_COMMIT_SHA"

# ==========================================================
# 6. DEPLOY TO AWS EC2 THROUGH OIDC + SSM
# ==========================================================

deploy_production:
  stage: deploy

  image: amazon/aws-cli:2.31.0

  needs:
    - container_scan

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  id_tokens:
    AWS_OIDC_TOKEN:
      aud: https://gitlab.com

  before_script:
    - umask 077
    - printf '%s' "$AWS_OIDC_TOKEN" > /tmp/aws-web-identity-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws-web-identity-token
    - export AWS_ROLE_ARN="$AWS_DEPLOY_ROLE_ARN"
    - export AWS_DEFAULT_REGION="ap-south-2"
    - aws sts get-caller-identity

  script:
    - |
      set -eu

      # Build the remote deployment script without embedding secrets.
      COMMAND_SCRIPT=$(cat <<'REMOTE_SCRIPT'
      set -eu
      set +x

      cd /opt/marutfit

      test -f docker-compose.aws.yml
      test -f .env
      test -f registry.env

      # Load existing registry credentials securely.
      set -a
      . /opt/marutfit/registry.env
      set +a

      : "${GITLAB_REGISTRY_USER:?Registry username missing}"
      : "${GITLAB_REGISTRY_PASSWORD:?Registry password missing}"

      printf '%s' "$GITLAB_REGISTRY_PASSWORD" |
        docker login registry.gitlab.com \
          -u "$GITLAB_REGISTRY_USER" \
          --password-stdin

      # Ensure the existing Docker network is available.
      docker network inspect marutfit >/dev/null 2>&1 ||
        docker network create \
          --driver bridge \
          --subnet 172.20.0.0/24 \
          marutfit

      # Validate Compose configuration before changing containers.
      docker compose -f docker-compose.aws.yml config -q

      # Pull all images before replacing running containers.
      docker compose -f docker-compose.aws.yml pull

      # Update application containers.
      docker compose \
        -f docker-compose.aws.yml \
        up -d --remove-orphans

      # Report running container status.
      docker compose -f docker-compose.aws.yml ps
      REMOTE_SCRIPT
      )

      # Supply immutable image tags to the remote script.
      COMMAND_SCRIPT="$COMMAND_SCRIPT
      export BACKEND_IMAGE='$BACKEND_IMAGE:$CI_COMMIT_SHA'
      export FRONTEND_IMAGE='$FRONTEND_IMAGE:$CI_COMMIT_SHA'
      export NGINX_IMAGE='$NGINX_IMAGE:$CI_COMMIT_SHA'"

      # Encode the command as valid JSON for AWS Systems Manager.
      PARAMETERS=$(printf '%s' "$COMMAND_SCRIPT" |
        python3 -c 'import json,sys; print(json.dumps({"commands":[sys.stdin.read()]}))')

      COMMAND_ID=$(aws ssm send-command \
        --region "$AWS_DEFAULT_REGION" \
        --instance-ids "$AWS_EC2_INSTANCE_ID" \
        --document-name "AWS-RunShellScript" \
        --parameters "$PARAMETERS" \
        --query 'Command.CommandId' \
        --output text)

      echo "SSM deployment command submitted."

      # Wait for the remote deployment result.
      for i in $(seq 1 30); do
        STATUS=$(aws ssm get-command-invocation \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$AWS_EC2_INSTANCE_ID" \
          --query 'Status' \
          --output text 2>/dev/null || echo "Pending")

        echo "Deployment status: $STATUS"

        case "$STATUS" in
          Success)
            echo "EC2 deployment command completed."
            exit 0
            ;;
          Failed|Cancelled|TimedOut)
            echo "EC2 deployment failed."
            aws ssm get-command-invocation \
              --region "$AWS_DEFAULT_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$AWS_EC2_INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text || true
            exit 1
            ;;
        esac

        sleep 10
      done

      echo "Deployment status could not be confirmed in time."
      exit 1

# ==========================================================
# 7. POST-DEPLOYMENT HEALTH CHECK
# ==========================================================

health_check:
  stage: verify

  image: curlimages/curl:latest

  needs:
    - deploy_production

  rules:
    - if: '$CI_COMMIT_BRANCH == "v1"'

  script:
    - test -n "$EC2_PUBLIC_IP"
    - >-
      curl
      --fail
      --silent
      --show-error
      --retry 5
      --retry-delay 3
      --retry-connrefused
      --max-time 20
      "http://$EC2_PUBLIC_IP/health"
